services:
  holehe-api:
    build: .
    image: holehe-api:local
    container_name: holehe-api
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      MAX_CONCURRENT_SCANS: ${MAX_CONCURRENT_SCANS:-4}
      HOLEHE_TIMEOUT: ${HOLEHE_TIMEOUT:-10}
      HOLEHE_MODULE_CONCURRENCY: ${HOLEHE_MODULE_CONCURRENCY:-50}
      GHUNT_ENABLED: ${GHUNT_ENABLED:-true}
      GHUNT_TIMEOUT: ${GHUNT_TIMEOUT:-20}
      GHUNT_CREDS_B64: ${GHUNT_CREDS_B64:-}
