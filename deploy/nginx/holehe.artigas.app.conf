# Installed on the EC2 host at /etc/nginx/conf.d/holehe.artigas.app.conf
# TLS blocks are appended by: sudo certbot --nginx -d holehe.artigas.app --redirect
server {
    listen 80;
    server_name holehe.artigas.app;

    location / {
        proxy_pass         http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # a full scan takes ~10-60s depending on HOLEHE_TIMEOUT
        proxy_read_timeout 120s;
    }
}
